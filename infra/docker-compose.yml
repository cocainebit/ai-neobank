services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: relay
      POSTGRES_USER: relay
      POSTGRES_PASSWORD: relay_local_only
    ports:
      - "127.0.0.1:54339:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U relay -d relay"]
      interval: 2s
      timeout: 2s
      retries: 20
    volumes:
      - relay_postgres:/var/lib/postgresql/data

volumes:
  relay_postgres:
